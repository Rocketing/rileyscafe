
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☆ riley &lt;3</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --pink: #f5a6d5;
    --pink-light: #ffd8ef;
    --text: #f8f4fa;
    --muted: #aaa4b5;
    --glass: rgba(255,255,255,.055);
    --border: rgba(255,255,255,.1);
    --green: #46e88b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #09080e;
    color: var(--text);
    font-family: Inter, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.mesh {
    position: fixed;
    inset: -20%;
    z-index: -2;
    background:
        radial-gradient(ellipse at 20% 20%, rgba(161,76,153,.28), transparent 38%),
        radial-gradient(ellipse at 75% 25%, rgba(78,69,165,.24), transparent 35%),
        radial-gradient(ellipse at 65% 80%, rgba(202,95,157,.18), transparent 38%),
        radial-gradient(ellipse at 15% 80%, rgba(79,61,125,.2), transparent 35%),
        #09080e;
    filter: blur(35px);
    animation: meshMove 18s ease-in-out infinite alternate;
}

@keyframes meshMove {
    from { transform: translate(-2%, -1%) scale(1); }
    to { transform: translate(2%, 2%) scale(1.08); }
}

.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: .13;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
}

.app {
    width: min(850px, 100%);
    min-height: 470px;
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 28px;
    background: rgba(20,17,28,.56);
    box-shadow: 0 25px 100px rgba(0,0,0,.35);
    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);
}

.sidebar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 13px;
    padding: 22px 10px;
    border-right: 1px solid var(--border);
    background: rgba(255,255,255,.025);
}

.nav-button {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    color: #aaa4b7;
    border: 1px solid transparent;
    border-radius: 15px;
    background: transparent;
    cursor: pointer;
    transition: .22s ease;
}

.nav-button svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.nav-button:hover {
    color: white;
    background: rgba(255,255,255,.07);
}

.nav-button.active {
    color: var(--pink-light);
    border-color: rgba(245,166,213,.18);
    background: rgba(245,166,213,.12);
    box-shadow: 0 0 25px rgba(245,166,213,.06);
}

.content {
    min-width: 0;
    padding: 35px;
}

.page {
    display: none;
    animation: fadeIn .25s ease;
}

.page.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
    color: var(--pink);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    margin-bottom: 12px;
}

h1 {
    font-size: clamp(27px, 4vw, 38px);
    letter-spacing: -1.8px;
    font-weight: 600;
    margin-bottom: 9px;
}

h2 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.4px;
}

p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
}

.home-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    gap: 25px;
    align-items: center;
    min-height: 395px;
}

.intro {
    padding-top: 14px;
}

.accent {
    color: var(--pink-light);
}

.profile-column {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.profile-card,
.music-pill,
.friend-card,
.stat-card {
    border: 1px solid var(--border);
    background: var(--glass);
    border-radius: 20px;
}

.profile-card {
    padding: 17px;
    text-align: center;
}

.profile-card img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.profile-name {
    margin-top: 11px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -.7px;
}

.profile-subtitle {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.music-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    padding: 10px;
    border-radius: 16px;
    background: rgba(255,255,255,.045);
}

.music-pill img {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
}

.music-details {
    min-width: 0;
}

.music-title {
    font-size: 11px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.music-artist {
    color: var(--muted);
    font-size: 10px;
    margin-top: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
}

.social-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 24px;
}

.social-link {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 17px;
    min-width: 0;
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: var(--glass);
    transition: .2s ease;
}

.social-link:hover,
.friend-card:hover {
    border-color: rgba(245,166,213,.3);
    background: rgba(255,255,255,.075);
    transform: translateY(-2px);
}

.social-icon {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    color: var(--pink-light);
    border-radius: 12px;
    background: rgba(245,166,213,.1);
    font-size: 18px;
}

.social-title {
    font-size: 12px;
    font-weight: 600;
}

.social-description {
    color: var(--muted);
    font-size: 10px;
    margin-top: 5px;
    overflow-wrap: anywhere;
}

.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 5px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(0,0,0,.12);
    margin-bottom: 17px;
}

.tab {
    flex: 1;
    padding: 10px 12px;
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    transition: .2s ease;
}

.tab.active {
    color: var(--pink-light);
    background: rgba(245,166,213,.12);
}

.music-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
}

.track-card {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--glass);
    transition: border-color .2s ease, box-shadow .2s ease;
}

.track-card.playing {
    border-color: var(--green);
    box-shadow: 0 0 0 1px rgba(70,232,139,.3), 0 0 18px rgba(70,232,139,.08);
}

.track-card img {
    width: 51px;
    height: 51px;
    object-fit: cover;
    flex-shrink: 0;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
}

.track-info {
    min-width: 0;
}

.track-name {
    font-size: 11px;
    font-weight: 600;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.track-artist {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.5;
}

.track-rank {
    color: var(--pink);
    font-size: 10px;
    margin-top: 5px;
}

.playing-label {
    color: var(--green);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.stat-card {
    padding: 20px;
}

.stat-value {
    margin-top: 12px;
    font-size: 26px;
    letter-spacing: -1px;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.stat-label {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
}

.friends-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.friend-card {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px;
    min-width: 0;
    color: var(--text);
    text-decoration: none;
    transition: .2s ease;
}

.friend-card img {
    width: 53px;
    height: 53px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 16px;
    background: rgba(255,255,255,.06);
}

.friend-name {
    font-size: 12px;
    font-weight: 600;
}

.status-message {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 28px 10px;
    grid-column: 1 / -1;
}

@media (max-width: 650px) {
    body {
        padding: 12px;
        align-items: flex-start;
    }

    .social-list,

        grid-template-columns: 1fr;
    }

    .section-heading {
        align-items: flex-start;
    }

    h1 {
        font-size: 30px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>

<script>
const LASTFM_USERNAME = "meowriley";
const LASTFM_API_KEY = "7e08154dd8b8aa8d7dffaba0d872b8b6";
const ARIA_DISCORD_ID = "506950390839902208";
const RILEY_DISCORD_ID = "1142433636822548601";

document.querySelectorAll(".nav-button").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".nav-button").forEach(item => item.classList.remove("active"));
        document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));

        button.classList.add("active");
        document.getElementById(button.dataset.page).classList.add("active");
    });
});

async function loadDiscordAvatar(userId, imageElementId) {
    try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
        const result = await response.json();

        if (!result.success || !result.data?.discord_user) return;

        const user = result.data.discord_user;
        const image = document.getElementById(imageElementId);

        if (!image || !user.avatar) return;

        const extension = user.avatar.startsWith("a_") ? "gif" : "png";
        image.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}?size=256`;
    } catch (error) {
        console.error("Couldn't load Discord avatar:", error);
    }
}

async function loadDiscordStatus() {
    try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${RILEY_DISCORD_ID}`);
        const result = await response.json();

        if (!result.success || !result.data) return;

        const labels = {
            online: "online",
            idle: "away",
            dnd: "do not disturb",
            offline: "offline"
        };

        document.getElementById("discord-status").textContent =
            labels[result.data.discord_status] || "just vibing";
    } catch (error) {
        console.error("Couldn't load Discord status:", error);
    }
}

const LASTFM_BASE = "https://ws.audioscrobbler.com/2.0/";
let currentlyPlayingTrack = null;

async function lastfm(method, params = {}) {
    const query = new URLSearchParams({
        method,
        user: LASTFM_USERNAME,
        api_key: LASTFM_API_KEY,
        format: "json",
        ...params
    });

    const response = await fetch(`${LASTFM_BASE}?${query}`);
    const data = await response.json();

    if (data.error) throw new Error(data.message || "Last.fm API error");
    return data;
}

function imageUrl(item) {
    const images = item?.image || [];
    const preferred = [...images].reverse().find(image => image["#text"]);
    return preferred?.["#text"] || "https://placehold.co/100x100/201927/f5a6d5?text=%E2%99%AB";
}

function trackKey(track) {
    const artist = track?.artist?.["#text"] || track?.artist?.name || track?.artist || "";
    return `${String(track?.name || track?.title || "").trim().toLowerCase()}::${String(artist).trim().toLowerCase()}`;
}

function updateNowPlaying(track) {
    const cover = document.getElementById("now-playing-cover");
    const title = document.getElementById("now-playing-title");
    const artist = document.getElementById("now-playing-artist");

    currentlyPlayingTrack = track && track["@attr"]?.nowplaying === "true" ? trackKey(track) : null;

    if (!track) {
        title.textContent = "not playing anything";
        artist.textContent = LASTFM_USERNAME;
        return;
    }

    cover.src = imageUrl(track);
    title.textContent = track.name || "unknown track";
    artist.textContent = track.artist?.["#text"] || track.artist?.name || "unknown artist";

    document.querySelectorAll(".track-card").forEach(card => {
        const isPlaying = card.dataset.trackKey === currentlyPlayingTrack && currentlyPlayingTrack !== null;
        card.classList.toggle("playing", isPlaying);

        const rank = card.querySelector(".track-rank");
        if (rank) {
            rank.classList.toggle("playing-label", isPlaying);
            if (isPlaying && !rank.dataset.originalText) {
                rank.dataset.originalText = rank.textContent;
                rank.textContent = "▶ currently playing";
            } else if (!isPlaying && rank.dataset.originalText) {
                rank.textContent = rank.dataset.originalText;
                delete rank.dataset.originalText;
            }
        }
    });
}

async function loadNowPlaying() {
    try {
        const data = await lastfm("user.getrecenttracks", { limit: "1" });
        const track = data.recenttracks?.track?.[0];

        updateNowPlaying(track || null);
    } catch (error) {
        console.error("Couldn't load now playing:", error);
        document.getElementById("now-playing-title").textContent = "music unavailable";
    }
}

function createTrackCard(track, index, subtitle = "") {
    const card = document.createElement("div");
    card.className = "track-card";
    card.dataset.trackKey = trackKey(track);

    const img = document.createElement("img");
    img.src = imageUrl(track);
    img.alt = "";
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "track-info";

    const name = document.createElement("div");
    name.className = "track-name";
    name.textContent = track.name || track.title || "Unknown";

    const artist = document.createElement("div");
    artist.className = "track-artist";
    artist.textContent = track.artist?.["#text"] || track.artist?.name || track.artist || "Unknown artist";

    const rank = document.createElement("div");
    rank.className = "track-rank";
    rank.textContent = subtitle || `#${index + 1}`;

    info.append(name, artist, rank);
    card.append(img, info);

    if (currentlyPlayingTrack && card.dataset.trackKey === currentlyPlayingTrack) {
        card.classList.add("playing");
        rank.classList.add("playing-label");
        rank.textContent = "▶ currently playing";
    }

    return card;
}

function showMessage(message) {
    const content = document.getElementById("music-content");
    content.className = "music-grid";
    content.innerHTML = "";

    const element = document.createElement("div");
    element.className = "status-message";
    element.textContent = message;
    content.appendChild(element);
}

async function loadRecentTracks() {
    showMessage("loading recent tracks...");

    try {
        const data = await lastfm("user.getrecenttracks", { limit: "10" });
        const tracks = data.recenttracks?.track || [];
        const content = document.getElementById("music-content");

        content.innerHTML = "";
        content.className = "music-grid";

        if (!tracks.length) return showMessage("no recent tracks found.");

        tracks.forEach((track, index) => content.appendChild(createTrackCard(track, index)));
    } catch (error) {
        showMessage("couldn't load tracks. check your Last.fm API key.");
    }
}

async function loadTopAlbums() {
    showMessage("loading albums...");

    try {
        const data = await lastfm("user.gettopalbums", { limit: "10", period: "overall" });
        const albums = data.topalbums?.album || [];
        const content = document.getElementById("music-content");

        content.innerHTML = "";
        content.className = "music-grid";

        if (!albums.length) return showMessage("no albums found.");

        albums.forEach((album, index) => {
            content.appendChild(createTrackCard({
                name: album.name,
                artist: album.artist?.name || "Unknown artist",
                image: album.image
            }, index, `${Number(album.playcount || 0).toLocaleString()} plays`));
        });
    } catch (error) {
        showMessage("couldn't load albums. check your Last.fm API key.");
    }
}

async function loadTopTracks() {
    showMessage("loading top tracks...");

    try {
        const data = await lastfm("user.gettoptracks", { limit: "10", period: "1month" });
        const tracks = data.toptracks?.track || [];
        const content = document.getElementById("music-content");

        content.innerHTML = "";
        content.className = "music-grid";

        if (!tracks.length) return showMessage("no top tracks found.");

        tracks.forEach((track, index) => {
            content.appendChild(createTrackCard(track, index, `${Number(track.playcount || 0).toLocaleString()} plays this month`));
        });
    } catch (error) {
        showMessage("couldn't load top tracks. check your Last.fm API key.");
    }
}

async function loadStats() {
    showMessage("loading your stats...");

    try {
        const [infoData, artistsData, albumsData, tracksData] = await Promise.all([
            lastfm("user.getinfo"),
            lastfm("user.gettopartists", { limit: "1", period: "overall" }),
            lastfm("user.gettopalbums", { limit: "1", period: "overall" }),
            lastfm("user.gettoptracks", { limit: "1", period: "overall" })
        ]);

        const user = infoData.user || {};
        const artists = artistsData.topartists?.["@attr"]?.total || artistsData.topartists?.artist?.length || 0;
        const albums = albumsData.topalbums?.["@attr"]?.total || albumsData.topalbums?.album?.length || 0;
        const tracks = tracksData.toptracks?.["@attr"]?.total || tracksData.toptracks?.track?.length || 0;

        const content = document.getElementById("music-content");
        content.className = "stats-grid";
        content.innerHTML = "";

        [
            ["Scrobbles", user.playcount],
            ["Artists", artists],
            ["Albums", albums],
            ["Tracks", tracks]
        ].forEach(([label, value]) => {
            const card = document.createElement("div");
            card.className = "stat-card";

            const number = document.createElement("div");
            number.className = "stat-value";
            number.textContent = Number(value || 0).toLocaleString();

            const caption = document.createElement("div");
            caption.className = "stat-label";
            caption.textContent = label;

            card.append(number, caption);
            content.appendChild(card);
        });
    } catch (error) {
        showMessage("couldn't load your stats. check your Last.fm API key.");
    }
}

const musicLoaders = {
    tracks: loadRecentTracks,
    albums: loadTopAlbums,
    toptracks: loadTopTracks,
    stats: loadStats
};

document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
        button.classList.add("active");
        musicLoaders[button.dataset.tab]();
    });
});

loadDiscordAvatar(ARIA_DISCORD_ID, "aria-avatar");
loadDiscordAvatar(RILEY_DISCORD_ID, "profile-avatar");
loadDiscordStatus();
loadNowPlaying();
loadRecentTracks();

setInterval(loadNowPlaying, 30000);
</script>
</body>
</html>
